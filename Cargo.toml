[workspace]
resolver = "2"
members = [
    "crates/syntrac-core",
    "crates/syntrac-store",
    "crates/syntrac-collector",
    "crates/syntrac-service",
    "crates/syntrac-testkit",
    "crates/syntrac-ipc",
    "crates/syntrac-demo",
    "crates/syntrac-llm",
    "app/src-tauri",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds keep file and line information for backtraces but not full variable debug info. Full debug info made target\debug grow to
# 86 GB (every test binary carries its own copy) and filled the drive. Use a local override for an interactive debugger session.
[profile.dev]
debug = "line-tables-only"

