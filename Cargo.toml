[workspace]
resolver = "2"
members = [
    "crates/syntrac-core",
    "crates/syntrac-store",
    "crates/syntrac-collector",
    "crates/syntrac-service",
    "crates/syntrac-testkit",
    "crates/syntrac-ipc",
    "crates/syntrac-demo",
    "crates/syntrac-llm",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

