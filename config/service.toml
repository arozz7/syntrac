# SYNTRAC collector service configuration.
# Every setting shown is the default; delete or edit as needed. Unknown keys are rejected.

# database_path = "C:/ProgramData/Syntrac/syntrac.db"   # default location when omitted

# Network activity is folded into flows over windows of this many seconds.
flow_window_secs = 10

# A finished window is stored this many seconds later, so events that arrive late (ETW delivers in
# buffered batches) join it instead of producing a duplicate row.
flow_flush_grace_secs = 3

# How often the sources are drained (milliseconds).
drain_interval_ms = 500

# Resource sampling.
metrics_interval_secs = 5
top_processes = 25            # heaviest processes recorded individually per sample; the rest are summed

# Retention: raw data older than this is removed, checked every purge_interval_minutes.
retention_days = 30
purge_interval_minutes = 60

# Completed hours are summarised into permanent hourly rollups and ledgers this often (a backlog is worked off sooner).
rollup_interval_minutes = 5

# How often a status line is logged (events stored, drops, own CPU).
status_interval_secs = 30

# If ETW delivers no events for this long, the trace session is restarted (at most etw_max_restarts times in a row;
# 0 means watch and report only). The health banner reports a silent trace either way.
etw_silent_restart_secs = 180
etw_max_restarts = 3
