# SYNTRAC collector service configuration.
# Every setting shown is the default; delete or edit as needed. Unknown keys are rejected.

# database_path = "C:/ProgramData/Syntrac/syntrac.db"   # default location when omitted

# Network activity is folded into flows over windows of this many seconds.
flow_window_secs = 10

# A finished window is stored this many seconds later, so events that arrive late (ETW delivers in
# buffered batches) join it instead of producing a duplicate row.
flow_flush_grace_secs = 3

# How often the sources are drained (milliseconds).
drain_interval_ms = 500

# Resource sampling.
metrics_interval_secs = 5
top_processes = 25            # heaviest processes recorded individually per sample; the rest are summed

# Retention: detail (events, flows, per-process samples) older than this is removed, checked every purge_interval_minutes,
# but ONLY once it has been rolled up into the permanent hourly summaries. (The old name retention_days still works.)
detail_retention_days = 14
purge_interval_minutes = 60

# Completed hours are summarised into permanent hourly rollups and ledgers this often (a backlog is worked off sooner).
rollup_interval_minutes = 5

# How often a status line is logged (events stored, drops, own CPU).
status_interval_secs = 30

# If ETW delivers no events for this long, the trace session is restarted (at most etw_max_restarts times in a row;
# 0 means watch and report only). The health banner reports a silent trace either way.
etw_silent_restart_secs = 180
etw_max_restarts = 3

# Storage guard (checked every minute). The database lives on the data drive; these keep it from filling it.
#   max_database_gb      live data above this: the oldest rolled-up detail is trimmed early
#   min_free_space_gb    free space on the data drive below this: the same trimming
#   hard_floor_free_gb   free space below this: detail collection PAUSES (rollups, purging and status continue) until
#                        free space is back above min_free_space_gb. Must be less than min_free_space_gb.
max_database_gb = 10
min_free_space_gb = 20
hard_floor_free_gb = 5

# Identity worker: reads the files of programs SYNTRAC has seen (signature, version information, SHA-256) on its own thread,
# a few at a time so the disk is never hit hard. Nothing leaves the machine. A backlog (the first run) is worked off at
# identity_files_per_pass files every identity_backlog_pause_secs; otherwise a pass runs every identity_interval_minutes.
identity_interval_minutes = 5
identity_files_per_pass = 5
identity_backlog_pause_secs = 30
identity_max_hash_mb = 512     # a larger file is not hashed (its size is still recorded)

# Context worker: records which account each program runs as (SYSTEM, a service account, you) and which Windows services it
# hosts, on its own thread. It only LOOKS at the running programs (one process snapshot and one token read per process; about
# 15 ms of CPU per look) and writes a program only when it is new, changed, or due for a refresh. Nothing leaves the machine.
# The account names (they contain your Windows user name) are kept in the local database only.
context_enabled = true
context_interval_secs = 30      # seconds between two looks; a program that runs for less than this can be missed
context_refresh_minutes = 10    # a program that keeps running has its "last seen" moved this often, not every look

# Owner data (docs/OWNER-PLAN.md): which network owns an address. This is the ONLY thing SYNTRAC ever downloads, and only when you
# press "Download owner data" in the app (one public-domain file from iptoasn.com). Set this to false to make the service refuse
# to download anything, even when asked.
owner_data_allowed = true

# Launch records (docs/RUNAS-PLAN.md, I4b): how each program gets started. Every few minutes the service reads, read-only, the
# Windows services, the scheduled tasks, the Run and RunOnce keys and the Startup folders, and keeps which program each one starts.
# The same sweep reads the Uninstall registry keys (install records: which product an installer registered for a folder).
# Evidence only: "no start-up entry found" means "not found in the places read", never "does not autostart".
launch_enabled = true
launch_interval_minutes = 10

# Findings (docs/ALERTS-PLAN.md): the detect worker looks for what is new or unusual and keeps it as findings for the Findings tab.
# A finding is evidence, never a verdict. OFF until you have read the backtest: the first time it runs is the moment "new" starts
# counting, and everything that exists then counts as already here. Nothing it does leaves the machine. Run the backtest first:
#   cargo run --release -p syntrac-store --example rehearse_detect -- <database> <work folder> 1 2 3 5
detect_enabled = true
detect_interval_minutes = 5
# Known patterns of rogue software (docs/PATTERNS.md, F5a): a fixed set of rules shipped inside the program (config/patterns), each tied
# to a public technique name, each saying what could be harmless. A match is at most "suspicious", never a verdict. Nothing is downloaded.
# OFF until you have read the backtest (the rehearse_detect example prints what each pattern matches today); needs detect_enabled too.
patterns_enabled = false
# At most this many NEW findings per run; the rest are counted, most serious first.
detect_max_new_per_run = 50

# Usage rules (docs/ALERTS-PLAN.md, F3): a program using clearly more than it usually does, judged against its own last days. A finding
# needs more than 3 times its usual (95th percentile) AND 1.5 times its busiest hour, over these floors, for two hours in a row (or one hour
# of uploading ten times its busiest). CPU, memory, bytes sent and bytes received per program; not disk per program (not stored).
usage_window_days = 14
usage_min_active_hours = 48
# CPU is a share of the WHOLE machine, so the floor depends on the core count: 0 means half of one core (50 / logical cores, at least 1.5).
usage_cpu_floor_percent = 0.0
usage_memory_floor_mb = 500
usage_net_floor_mb = 100
