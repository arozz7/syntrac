[package]
name = "syntrac-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ferrisetw = "1.2.0"
sha2 = "0.11.0"
syntrac-core = { version = "0.1.0", path = "../syntrac-core" }
sysinfo = "0.36.1"
tracing = "0.1.44"
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
syntrac-testkit = { path = "../syntrac-testkit" }
tempfile = "3.27.0"

