[package]
name = "syntrac-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Synthetic demo data: a fictional machine for screenshots, and a way to try the app without the service"

[dependencies]
serde_json = "1.0.154"
syntrac-core = { path = "../syntrac-core" }
syntrac-store = { path = "../syntrac-store" }
syntrac-ipc = { path = "../syntrac-ipc" }
syntrac-service = { path = "../syntrac-service" }
syntrac-testkit = { path = "../syntrac-testkit" }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

[[bin]]
name = "make-demo-db"
path = "src/bin/make_demo_db.rs"

[[bin]]
name = "demo-collector"
path = "src/bin/demo_collector.rs"

[[bin]]
name = "demo-model"
path = "src/bin/demo_model.rs"

[[bin]]
name = "broken-service"
path = "src/bin/broken_service.rs"

[lints]
workspace = true
