[package]
name = "syntrac-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
syntrac-collector = { path = "../syntrac-collector" }
syntrac-core = { path = "../syntrac-core" }
syntrac-ipc = { path = "../syntrac-ipc" }
syntrac-store = { path = "../syntrac-store" }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-service = "0.8.1"

[lints]
workspace = true

[dev-dependencies]
syntrac-testkit = { path = "../syntrac-testkit" }
tempfile = "3.27.0"

