[package]
name = "syntrac-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The logic lives in the library so it can be unit-tested; main.rs only starts Tauri.
[lib]
name = "syntrac_app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
syntrac-core = { path = "../../crates/syntrac-core" }
syntrac-store = { path = "../../crates/syntrac-store" }
syntrac-ipc = { path = "../../crates/syntrac-ipc" }

[dev-dependencies]
syntrac-testkit = { path = "../../crates/syntrac-testkit" }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[lints]
workspace = true
